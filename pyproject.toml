[project]
name = "parts-cad"
version = "0.1.0"
description = "Check, quote and build workspace for machined parts (3-axis CNC)"
requires-python = ">=3.11"
dependencies = [
    "cadquery-ocp>=7.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "anthropic>=1.10",
    "pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pypdf>=4"]

[tool.setuptools]
packages = ["app", "app.pipeline", "app.build", "app.build.bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
