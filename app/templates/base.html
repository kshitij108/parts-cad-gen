<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}parts-cad{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">parts-cad</a>
    <nav><a href="/">Jobs</a><a href="/rate-card">Rate card</a></nav>
  </header>
  <main>
    {% if shop.rate_card_is_example %}
    <div class="banner warn">The rate card still contains <strong>example numbers</strong>. Quotes are not meaningful until you <a href="/rate-card">enter your shop's rates</a>.</div>
    {% endif %}
    {% if error %}<div class="banner err">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
